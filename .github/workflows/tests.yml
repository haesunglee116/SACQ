name: CPU tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.cpu_pipeline
      - run: python tools/release_check.py
      - run: python -m build
      - run: python tools/check_distribution.py dist/*.tar.gz
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_core.py -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_cache.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: package-python-${{ matrix.python }}
          path: dist/
